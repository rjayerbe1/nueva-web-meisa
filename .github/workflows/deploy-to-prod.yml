name: Deploy to prod (Cloud Run)

# Deploy MANUAL a producción (meisa.com.co → service meisa-web).
# No rebuildea: promueve la imagen que ya corre en dev (meisa-web-dev),
# así lo que se probó en dev.meisa.com.co es exactamente lo que va a prod.
# Disparo: GitHub → Actions → "Deploy to prod (Cloud Run)" → Run workflow.

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: 'SHA del commit cuya imagen deployar (vacío = la imagen que corre en dev ahora)'
        required: false
        default: ''

env:
  PROJECT_ID: meisa-web-prod-2025
  SERVICE_NAME: meisa-web
  DEV_SERVICE_NAME: meisa-web-dev
  REGION: us-central1
  IMAGE_REPO: us-central1-docker.pkg.dev/meisa-web-prod-2025/cloud-run-source-deploy/meisa-web-dev

jobs:
  deploy:
    name: Promote dev image to prod (meisa.com.co)
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve image to deploy
        id: image
        run: |
          if [ -n "${{ github.event.inputs.image_sha }}" ]; then
            IMAGE="${{ env.IMAGE_REPO }}:${{ github.event.inputs.image_sha }}"
          else
            IMAGE=$(gcloud run services describe ${{ env.DEV_SERVICE_NAME }} \
              --project=${{ env.PROJECT_ID }} \
              --region=${{ env.REGION }} \
              --format='value(spec.template.spec.containers[0].image)')
          fi
          echo "Imagen a deployar: $IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # --update-env-vars (NO --set-env-vars) para no borrar las vars que ya
      # tiene el servicio (GOOGLE_CLIENT_ID/SECRET, NEXTAUTH_SECRET, MEISA_*,
      # secret de Gmail DWD, etc.). NEXTAUTH_URL hardcodeado al dominio prod.
      - name: Deploy to Cloud Run (meisa-web → meisa.com.co)
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ steps.image.outputs.image }} \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --update-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }},NEXTAUTH_URL=https://meisa.com.co,REPLICATE_API_TOKEN=${{ secrets.REPLICATE_API_TOKEN }},TALENTO_SYNC_SECRET=${{ secrets.TALENTO_SYNC_SECRET }}"

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "Service URL: $URL"
          for path in / /proyectos /servicios /contacto; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
