name: Deploy to dev (Cloud Run)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'
  PROJECT_ID: meisa-web-prod-2025
  SERVICE_NAME: meisa-web-dev
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/meisa-web-prod-2025/cloud-run-source-deploy/meisa-web-dev

jobs:
  test:
    name: Type check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      # Next.js SSG consulta Prisma en build (páginas públicas DB-driven).
      # Pasamos DATABASE_URL real para que el build pueda prerender.
      - name: Build application
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run build

  deploy:
    name: Deploy to Cloud Run (dev.meisa.com.co)
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # Construimos la imagen aquí (no con --source .) para poder pasar
      # DATABASE_URL como --build-arg — lo necesita Next.js SSG.
      - name: Build and push Docker image
        run: |
          docker build \
            --build-arg DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --build-arg NEXT_PUBLIC_CHAT_ENABLED="${{ vars.NEXT_PUBLIC_CHAT_ENABLED }}" \
            --build-arg NEXT_PUBLIC_TURNSTILE_SITE_KEY="${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}" \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      # --update-env-vars (NO --set-env-vars) para no borrar las vars que ya
      # tiene el servicio (GOOGLE_CLIENT_ID/SECRET, NEXTAUTH_SECRET,
      # MEISA_ADMIN_EMAIL, etc.). NEXTAUTH_URL va hardcodeado al dominio de dev.
      - name: Deploy to Cloud Run (meisa-web-dev → dev.meisa.com.co)
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --update-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }},NEXTAUTH_URL=https://dev.meisa.com.co,REPLICATE_API_TOKEN=${{ secrets.REPLICATE_API_TOKEN }},TALENTO_SYNC_SECRET=${{ secrets.TALENTO_SYNC_SECRET }}"

      - name: Show deployment URL
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)'
