name: Deploy to dev (Cloud Run)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'
  PROJECT_ID: meisa-web-prod-2025
  SERVICE_NAME: meisa-web-dev
  REGION: us-central1

jobs:
  test:
    name: Type check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy to Cloud Run (dev.meisa.com.co)
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # NOTE: usamos --update-env-vars (NO --set-env-vars) para NO borrar las
      # variables ya configuradas en el servicio (GOOGLE_CLIENT_ID,
      # GOOGLE_CLIENT_SECRET, NEXTAUTH_SECRET, MEISA_ADMIN_EMAIL, etc.).
      # NEXTAUTH_URL va hardcodeado a dev.meisa.com.co — el secret de GitHub
      # tiene el valor viejo de prod y no queremos sobrescribirlo.
      - name: Deploy to Cloud Run (meisa-web-dev → dev.meisa.com.co)
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --update-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }},NEXTAUTH_URL=https://dev.meisa.com.co,REPLICATE_API_TOKEN=${{ secrets.REPLICATE_API_TOKEN }}"

      - name: Show deployment URL
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)'
